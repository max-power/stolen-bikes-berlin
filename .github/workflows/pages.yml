name: Build and deploy dashboard

on:
  schedule:
    - cron: "23 5 * * *" # daily; the police file is refreshed every day
  workflow_dispatch: # manual run from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build dashboard (download latest CSV first)
        run: |
          python build.py --fetch || {
            echo "::warning::Could not download the latest CSV - building from the CSV committed in the repo (data may be out of date)."
            python build.py
          }

      - name: Assemble site
        run: |
          mkdir _site
          cp index.html _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
