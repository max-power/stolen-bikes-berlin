<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestohlene Fahrräder Berlin</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10);
  --series-1: #2a78d6; --series-strong: #184f95; --band: rgba(42,120,214,.10);
  --zero: #ecebe6; --na: #d9d8d2; --map-stroke: #fcfcfb;
  --seq-1:#cde2fb; --seq-2:#9ec5f4; --seq-3:#6da7ec; --seq-4:#3987e5; --seq-5:#256abf; --seq-6:#184f95; --seq-7:#0d366b;
  --ghost: rgba(11,11,11,.05);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
    --series-1: #3987e5; --series-strong: #86b6ef; --band: rgba(57,135,229,.14);
    --zero: #262624; --na: #3a3a37; --map-stroke: #1a1a19;
    --seq-1:#0d366b; --seq-2:#184f95; --seq-3:#256abf; --seq-4:#3987e5; --seq-5:#6da7ec; --seq-6:#9ec5f4; --seq-7:#cde2fb;
    --ghost: rgba(255,255,255,.06);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
  --series-1: #3987e5; --series-strong: #86b6ef; --band: rgba(57,135,229,.14);
  --zero: #262624; --na: #3a3a37; --map-stroke: #1a1a19;
  --seq-1:#0d366b; --seq-2:#184f95; --seq-3:#256abf; --seq-4:#3987e5; --seq-5:#6da7ec; --seq-6:#9ec5f4; --seq-7:#cde2fb;
  --ghost: rgba(255,255,255,.06);
}
* { box-sizing: border-box; }
body { margin:0; background:var(--page); color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
.wrap { max-width:1200px; margin:0 auto; padding:24px 16px 48px; }
.hdr { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
h1 { font-size:26px; line-height:1.2; margin:0 0 4px; font-weight:650; letter-spacing:-.01em; }
.sub { color:var(--ink-2); margin:0 0 18px; max-width:70ch; }
.filters { display:flex; flex-wrap:wrap; gap:12px 16px; align-items:flex-end; margin-bottom:16px; }
.fg { display:flex; flex-direction:column; align-items:flex-start; gap:4px; min-width:0; max-width:100%; } /* label above its control */
.seg { display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface); }
.seg button { all:unset; cursor:pointer; padding:6px 12px; color:var(--ink-2); font-size:13px; white-space:nowrap; }
.seg button + button { border-left:1px solid var(--border); }
.seg button:hover { background:var(--ghost); }
.seg button[aria-pressed="true"] { background:var(--ink); color:var(--surface); font-weight:600; }
.seg button:focus-visible, select:focus-visible, input:focus-visible, .hrow:focus-visible, .chip:focus-visible, .tbtn:focus-visible { outline:2px solid var(--series-1); outline-offset:2px; }
select, input[type="date"] { background:var(--surface); color:var(--ink); border:1px solid var(--border); border-radius:8px; padding:5px 8px; font:inherit; font-size:13px; max-width:220px; }
#filters select { height:33px; box-sizing:border-box; } /* same height as the period control */
.lbl-f { color:var(--muted); font-size:12px; }
.pwrap { position:relative; }
.pgroup { display:inline-flex; border:1px solid var(--border); border-radius:8px; background:var(--surface); overflow:hidden; max-width:100%; }
.pgroup button { all:unset; box-sizing:border-box; cursor:pointer; color:var(--ink-2); display:inline-flex; align-items:center; gap:8px; padding:6px 10px; font-size:13px; }
.pgroup button + button { border-left:1px solid var(--border); }
.pgroup button:hover:not(:disabled) { background:var(--ghost); }
.pgroup button:disabled { opacity:.35; cursor:default; }
.pgroup button:focus-visible, .pop button:focus-visible { outline:2px solid var(--series-1); outline-offset:-2px; }
.pgroup .pchip { color:var(--ink); flex:1 1 auto; min-width:0; overflow:hidden; } /* beats `.pgroup button { all:unset }` */
.pgroup .pstep { flex:none; }
.pchip .pn { font-weight:600; white-space:nowrap; flex:none; }
.pchip .pd { color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pop { position:absolute; top:calc(100% + 6px); left:0; z-index:30; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:0 8px 28px rgba(0,0,0,.2); width:min(560px, calc(100vw - 32px)); }
.pop[hidden] { display:none; }
.pop-body { display:grid; grid-template-columns:170px 1fr; max-height:min(420px, 60vh); }
.pop-presets { display:flex; flex-direction:column; padding:8px; border-right:1px solid var(--border); overflow:auto; }
.pop-presets button { all:unset; box-sizing:border-box; cursor:pointer; display:flex; align-items:center; gap:6px; padding:6px 8px; border-radius:6px; font-size:13px; color:var(--ink); }
.pop-presets button:hover { background:var(--ghost); }
.pop-presets .ck { width:14px; flex:none; font-weight:700; }
.pop-presets button.act { font-weight:600; }
.pop-presets hr { border:0; border-top:1px solid var(--grid); margin:6px 0; width:100%; }
.pop-months { padding:10px 12px; overflow:auto; }
.pop-hint { color:var(--muted); font-size:12px; margin-bottom:8px; min-height:1.4em; }
.yr { margin-bottom:10px; }
.yr b { display:block; font-size:12px; color:var(--ink-2); margin-bottom:4px; }
.mgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; }
.mgrid button { all:unset; box-sizing:border-box; cursor:pointer; text-align:center; padding:6px 0; border-radius:6px; font-size:13px; color:var(--ink); }
.mgrid button:hover:not(:disabled) { background:var(--ghost); }
.mgrid button:disabled { color:var(--muted); opacity:.4; cursor:default; }
.mgrid button.part { background:var(--band); }
.mgrid button.in { background:var(--series-1); color:#fff; }
.mgrid button.anchor { outline:2px solid var(--ink); outline-offset:1px; }
.pop-foot { display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; padding:10px 12px; border-top:1px solid var(--border); }
.pop-foot .sp { flex:1; }
.pbtn { all:unset; box-sizing:border-box; cursor:pointer; padding:5px 12px; border-radius:8px; border:1px solid var(--border); font-size:13px; color:var(--ink); }
.pbtn:hover { background:var(--ghost); }
.pbtn.primary { background:var(--ink); color:var(--surface); border-color:var(--ink); font-weight:600; }
@media (max-width:640px) {
  .pop { position:fixed; left:0; right:0; bottom:0; top:auto; width:auto; border-radius:14px 14px 0 0; max-height:85vh; overflow:auto; }
  .pop-body { grid-template-columns:1fr; max-height:none; }
  .pop-presets { flex-direction:row; flex-wrap:wrap; border-right:0; border-bottom:1px solid var(--border); }
  .pop-presets hr { display:none; }
}
.chip { all:unset; cursor:pointer; display:inline-flex; gap:8px; align-items:center; background:var(--ink); color:var(--surface); border-radius:999px; padding:4px 12px; font-size:13px; }
.chip[hidden] { display:none; }
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:12px; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; min-width:0; }
.kpi .v { font-size:30px; font-weight:650; line-height:1.15; letter-spacing:-.01em; }
.kpi .l { color:var(--ink-2); font-size:13px; }
.kpi .n { color:var(--muted); font-size:12px; margin-top:2px; }
/* one shared 3-column grid: map = 2 columns, ranking = 1; the cards below use the same columns */
.grid2, .grid3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-bottom:12px; }
.grid2 > :first-child { grid-column:span 2; }
@media (max-width:1080px){
  .grid2 { grid-template-columns:minmax(0,1fr); }
  .grid2 > :first-child { grid-column:auto; }
  .grid3 { grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); }
}
.ch { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
.ch > div:first-child { flex:1 1 200px; min-width:0; }
.ch h2 { font-size:15px; margin:0; font-weight:600; }
.ch p { margin:2px 0 0; color:var(--muted); font-size:12px; }
.tbtn { all:unset; cursor:pointer; font-size:12px; color:var(--ink-2); border:1px solid var(--border); border-radius:6px; padding:2px 8px; white-space:nowrap; }
.tbtn:hover { background:var(--ghost); }
.tbtn[aria-pressed="true"] { background:var(--ghost); color:var(--ink); }
.mapcard { display:flex; flex-direction:column; }
#map { width:100%; height:auto; display:block; flex:1 1 auto; min-height:0; } /* spare height is shared above/below the map */
#map path { stroke:var(--map-stroke); stroke-width:.6; vector-effect:non-scaling-stroke; cursor:pointer; }
#map path:hover { stroke:var(--ink); stroke-width:1.5; }
#map path.sel { stroke:var(--ink); stroke-width:2.2; }
#map text { font-size:15px; fill:var(--ink); paint-order:stroke; stroke:var(--surface); stroke-width:3px; stroke-linejoin:round; font-weight:600; pointer-events:none; opacity:.85; }
.c0{fill:var(--zero)} .cna{fill:var(--na)} .c1{fill:var(--seq-1)} .c2{fill:var(--seq-2)} .c3{fill:var(--seq-3)} .c4{fill:var(--seq-4)} .c5{fill:var(--seq-5)} .c6{fill:var(--seq-6)} .c7{fill:var(--seq-7)}
.legend { display:flex; flex-wrap:wrap; align-items:flex-end; gap:2px; margin-top:8px; font-size:11px; color:var(--ink-2); }
.legend .sw { display:flex; flex-direction:column; gap:3px; align-items:flex-start; min-width:44px; }
.legend .sw i { display:block; width:100%; height:10px; border-radius:2px; border:1px solid var(--border); }
.legend .u { margin-left:10px; color:var(--muted); align-self:center; }
.hrow { display:grid; grid-template-columns:minmax(100px,48%) 1fr auto; gap:8px; align-items:center; padding:3px 4px; border-radius:6px; cursor:default; font-size:13px; }
.hrow[role="button"] { cursor:pointer; }
.hrow:hover { background:var(--ghost); }
.hrow .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink); }
.hrow .nm small { color:var(--muted); margin-left:4px; }
.hrow.two { grid-template-columns:minmax(150px,52%) 1fr auto; padding:2px 4px; }
.hrow.two .nm { white-space:normal; line-height:1.2; }
.hrow.two .nm small { display:block; margin:0 0 0 1.9em; font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hrow.two .nm .rk { float:left; margin-top:1px; }
.hrow.two .nm .tx { display:block; margin-left:1.9em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hrow.active .nm { font-weight:650; }
.hrow .track { height:12px; display:block; }
.hrow .bar { display:block; height:100%; background:var(--series-1); border-radius:0 4px 4px 0; min-width:2px; }
.hrow.active .bar { background:var(--series-strong); }
.hrow .val { font-variant-numeric:tabular-nums; color:var(--ink); text-align:right; min-width:3.2em; }
.rk { color:var(--muted); font-variant-numeric:tabular-nums; margin-right:6px; display:inline-block; min-width:1.4em; text-align:right; }
svg text { font-family:inherit; }
.ax { fill:var(--muted); font-size:11px; }
table.t { border-collapse:collapse; width:100%; font-size:13px; font-variant-numeric:tabular-nums; }
table.t th, table.t td { text-align:left; padding:4px 8px; border-bottom:1px solid var(--grid); }
table.t td:last-child, table.t th:last-child { text-align:right; }
.tblwrap { max-height:260px; overflow:auto; }
#tip { position:fixed; z-index:10; pointer-events:none; background:var(--surface); color:var(--ink); border:1px solid var(--border); border-radius:8px; padding:8px 10px; box-shadow:0 4px 16px rgba(0,0,0,.18); font-size:12px; max-width:260px; display:none; }
#tip b { display:block; font-size:13px; margin-bottom:2px; }
#tip .r { display:flex; justify-content:space-between; gap:14px; }
#tip .r span:first-child { color:var(--ink-2); }
#tip .r span:last-child { font-weight:650; font-variant-numeric:tabular-nums; }
.notes { color:var(--muted); font-size:12px; max-width:90ch; margin-top:20px; }
.notes li { margin-bottom:4px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <h1 data-i18n="title">Gestohlene Fahrräder in Berlin</h1>
    <span class="seg" id="seg-lang" role="group" data-i18n-aria="langAria" aria-label="Sprache">
      <button data-lang="de" aria-label="Deutsch">DE</button><button data-lang="en" aria-label="English">EN</button>
    </span>
  </div>
  <p class="sub" id="sub"></p>

  <div class="filters" id="filters">
    <div class="fg pwrap" id="pwrap">
      <span class="lbl-f" id="period-lbl" data-i18n="period">Period</span>
      <div class="pgroup" role="group" aria-labelledby="period-lbl">
        <button type="button" class="pstep" id="p-prev" data-i18n-aria="pPrev"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" class="pchip" id="pchip" aria-haspopup="dialog" aria-expanded="false" aria-controls="pop">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2 7h12M5 1.5v3M11 1.5v3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span class="pn" id="pn"></span><span class="pd" id="pd"></span>
          <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="pstep" id="p-next" data-i18n-aria="pNext"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="pop" id="pop" role="dialog" data-i18n-aria="pDialog" hidden>

          <label class="lbl-f" for="d-to" data-i18n="to">To</label><input type="date" id="d-to">

          <button type="button" class="pbtn primary" id="pop-apply" data-i18n="apply">Apply</button>

      </div>
    </div>
    <div class="fg"><label class="lbl-f" for="sel-delikt" data-i18n="offense">Offense</label><select id="sel-delikt"></select></div>
    <div class="fg"><label class="lbl-f" for="sel-type" data-i18n="biketype">Bike type</label><select id="sel-type"></select></div>
    <button class="chip" id="chip" hidden></button>
  </div>

  <section class="card" style="margin-bottom:12px" aria-labelledby="tl-h" data-card="tl">
    <div class="ch"><div><h2 id="tl-h" data-i18n="tlTitle"></h2><p id="tl-sub"></p></div><button class="tbtn" aria-pressed="false"></button></div>
    <div class="chart" id="tl" style="position:relative"></div>
    <div class="tblwrap" hidden></div>
  </section>

  <div class="kpis" id="kpis"></div>

  <div class="grid2">
    <section class="card mapcard" aria-labelledby="map-h">
      <div class="ch">
        <div><h2 id="map-h"></h2><p id="map-sub"></p></div>
        <span class="seg" id="seg-metric" role="group" data-i18n-aria="metricAria"></span>
      </div>
      <svg id="map" role="img"></svg>
      <div class="legend" id="legend"></div>
    </section>
    <section class="card" aria-labelledby="top-h">
      <div class="ch"><div><h2 id="top-h"></h2><p id="top-sub"></p></div></div>
      <div id="top"></div>
    </section>
  </div>

  <div class="grid3">
    <section class="card" aria-labelledby="hr-h" data-card="hr">
      <div class="ch"><div><h2 id="hr-h" data-i18n="hrTitle"></h2><p id="hr-sub"></p></div><button class="tbtn" aria-pressed="false"></button></div>
      <div class="chart" id="hr"></div><div class="tblwrap" hidden></div>
    </section>
    <section class="card" aria-labelledby="ty-h" data-card="ty">
      <div class="ch"><div><h2 id="ty-h" data-i18n="tyTitle"></h2><p id="ty-sub" data-i18n="tySub"></p></div><button class="tbtn" aria-pressed="false"></button></div>
      <div class="chart" id="ty"></div><div class="tblwrap" hidden></div>
    </section>
    <section class="card" aria-labelledby="di-h" data-card="di">
      <div class="ch"><div><h2 id="di-h" data-i18n="diTitle"></h2><p id="di-sub"></p></div><button class="tbtn" aria-pressed="false"></button></div>
      <div class="chart" id="di"></div><div class="tblwrap" hidden></div>
    </section>
  </div>

  <ul class="notes" id="notes"></ul>
</div>
<div id="tip" role="tooltip"></div>

<script>
const DATA = /*__DATA__*/null;
const {meta, areas, cases} = DATA;
const N = cases.p.length, NM = meta.monthStarts.length - 1;
const DAYMS = 864e5, D0 = Date.parse(meta.day0 + "T00:00:00Z");

/* ================= i18n ================= */
const I18N = {

    hrTitle:"Tageszeit", hrSub:p=>`Beginn des Tatzeitraums (Stunde) · nur Zeiträume ≤ 3 Std. (${p} % der Fälle)`, arHr:"Balkendiagramm der Diebstähle nach Tageszeit",

function renderMap(m) {

  let total = 0;
  for (let i = 0; i < N; i++) if (m[i]) { mapCounts[cases.p[i]]++; total++; }
  const vals = areas.map((_, i) => metricVal(i));

  const W = Math.max(300, host.clientWidth), H = 230, L = 44, R = 14, T = 12, B = 26, iw = W - L - R, ih = H - T - B;
  const svg = el("svg", {width:W, height:H, viewBox:`0 0 ${W} ${H}`, role:"img", "aria-label":t("arTl")}, host);
  const {max, step} = niceMax(Math.max(1, ...counts));
  const X = p => L + p / NM * iw, Y = v => T + ih - v / max * ih;
  for (let v = 0; v <= max + 1e-9; v += step) {
    el("line", {x1:L, x2:W - R, y1:Y(v), y2:Y(v), stroke:v === 0 ? "var(--axis)" : "var(--grid)"}, svg);
    const tx = el("text", {x:L - 8, y:Y(v) + 4, "text-anchor":"end", class:"ax"}, svg); tx.textContent = nf.format(v);
  }
  const dayPos = d => { let mi = 0; while (mi < NM - 1 && meta.monthStarts[mi + 1] <= d) mi++; return mi + (d - meta.monthStarts[mi]) / (meta.monthStarts[mi + 1] - meta.monthStarts[mi]); };
  if (!isFull()) {
    const [a, b] = periodRange(), x0 = X(dayPos(a)), x1 = X(Math.min(NM, dayPos(b + 1)));
    el("rect", {x:x0, y:T, width:Math.max(2, x1 - x0), height:ih, fill:"var(--band)"}, svg);
  }
  const every = NM > 14 && iw < 420 ? 4 : NM > 14 && iw < 620 ? 3 : NM > 10 ? 2 : 1;
  for (let mi = 0; mi < NM; mi++) if (mi % every === 0) { const tx = el("text", {x:X(mi + .5), y:H - 8, "text-anchor":"middle", class:"ax"}, svg); tx.textContent = monthLabel(mi); }
  const pts = counts.map((v, i) => [X(i + .5), Y(v)]);
  if (NM > 1) {
    const full = pts.slice(0, -1).map((p, i) => (i ? "L" : "M") + p[0] + " " + p[1]).join("");
    if (NM > 2) el("path", {d:full, fill:"none", stroke:"var(--series-1)", "stroke-width":2, "stroke-linejoin":"round", "stroke-linecap":"round"}, svg);
    const [p1, p2] = [pts[NM - 2], pts[NM - 1]];
    el("path", {d:`M${p1[0]} ${p1[1]}L${p2[0]} ${p2[1]}`, fill:"none", stroke:"var(--series-1)", "stroke-width":2, "stroke-dasharray":"4 4", "stroke-linecap":"round"}, svg);
  }
  const last = pts[NM - 1];
  el("circle", {cx:last[0], cy:last[1], r:4, fill:"var(--surface)", stroke:"var(--series-1)", "stroke-width":2}, svg);
  const note = el("text", {x:last[0], y:Math.max(T + 10, last[1] - 10), "text-anchor":"end", class:"ax"}, svg); note.textContent = t("partial");
  const cross = el("line", {y1:T, y2:T + ih, stroke:"var(--muted)", "stroke-dasharray":"2 3", visibility:"hidden"}, svg);
  const dot = el("circle", {r:4, fill:"var(--series-1)", stroke:"var(--surface)", "stroke-width":2, visibility:"hidden"}, svg);
  // selection brush: drag across months to pick a range (snaps to whole months); a plain click picks one month
  const brush = el("rect", {y:T, height:ih, fill:"var(--series-1)", "fill-opacity":.18, stroke:"var(--series-1)", "stroke-dasharray":"3 3", visibility:"hidden", "pointer-events":"none"}, svg);
  tlDrag = null; tlBrush = brush;
  const hit = el("rect", {x:L, y:T, width:iw, height:ih, fill:"transparent", style:"cursor:pointer; touch-action:pan-y"}, svg);
  const monthAt = e => Math.max(0, Math.min(NM - 1, Math.floor((e.clientX - svg.getBoundingClientRect().left - L) / iw * NM)));
  const monthName = mi => monLongF.format(dayMs(meta.monthStarts[mi])) + (mi === NM - 1 && meta.monthStarts[NM] - 1 > meta.maxDay ? t("tipTo", fmtDay(meta.maxDay)) : "");
  const endCross = () => { cross.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); };
  hit.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    tlDrag = {from:monthAt(e), to:monthAt(e), moved:false};
    try { hit.setPointerCapture(e.pointerId); } catch (err) {}
  });
  hit.addEventListener("pointermove", e => {
    const mi = monthAt(e);
    if (tlDrag) { tlDrag.to = mi; if (mi !== tlDrag.from) tlDrag.moved = true; }
    if (tlDrag && tlDrag.moved) {
      const lo = Math.min(tlDrag.from, tlDrag.to), hi = Math.max(tlDrag.from, tlDrag.to);
      brush.setAttribute("x", X(lo)); brush.setAttribute("width", X(hi + 1) - X(lo)); brush.setAttribute("visibility", "visible");
      endCross();
      showTip(e, monthLabel(lo) + " – " + monthLabel(hi), [[t("tCases"), nf.format(counts.slice(lo, hi + 1).reduce((a, b) => a + b, 0))]]);
      return;
    }
    cross.setAttribute("x1", pts[mi][0]); cross.setAttribute("x2", pts[mi][0]); cross.setAttribute("visibility", "visible");
    dot.setAttribute("cx", pts[mi][0]); dot.setAttribute("cy", pts[mi][1]); dot.setAttribute("visibility", "visible");
    showTip(e, monthName(mi), [[t("tCases"), nf.format(counts[mi])]]);
  });
  hit.addEventListener("pointerup", e => {
    const d = tlDrag; tlDrag = null; brush.setAttribute("visibility", "hidden");
    try { hit.releasePointerCapture(e.pointerId); } catch (err) {}
    if (!d) return;
    if (d.moved) { const lo = Math.min(d.from, d.to), hi = Math.max(d.from, d.to); setRange(monthRange(lo)[0], monthRange(hi)[1]); }
    else if (monthOfRange() === d.from) setRange(...FULL);
    else setRange(...monthRange(d.from));
  });
  hit.addEventListener("pointercancel", () => { tlDrag = null; brush.setAttribute("visibility", "hidden"); });
  hit.addEventListener("pointerleave", () => { endCross(); hideTip(); });
  const sel = state.sel >= 0 ? ` · ${areas[state.sel].name}` : "";
  document.getElementById("tl-sub").textContent = t("tlBase") + sel + (!isFull() ? t("tlShade") : "") + t("tlHint");
  setTable("tl", [t("hMonth"), t("tCases")], counts.map((c, i) => [monLongF.format(dayMs(meta.monthStarts[i])), nf.format(c)]));
}

/* ================= hour of day ================= */
function renderHour(m) {
  const counts = new Array(24).fill(0); let all = 0, short = 0;
  for (let i = 0; i < N; i++) if (m[i]) { all++; if (cases.h[i] >= 0) { counts[cases.h[i]]++; short++; } }
  const host = document.getElementById("hr"); host.replaceChildren();
  const W = Math.max(260, host.clientWidth), H = 210, L = 36, R = 6, T = 10, B = 24, iw = W - L - R, ih = H - T - B;
  const svg = el("svg", {width:W, height:H, viewBox:`0 0 ${W} ${H}`, role:"img", "aria-label":t("arHr")}, host);
  const {max, step} = niceMax(Math.max(1, ...counts), 3), bw = iw / 24;
  const Y = v => T + ih - v / max * ih;
  for (let v = 0; v <= max + 1e-9; v += step) {
    el("line", {x1:L, x2:W - R, y1:Y(v), y2:Y(v), stroke:v === 0 ? "var(--axis)" : "var(--grid)"}, svg);
    const tx = el("text", {x:L - 6, y:Y(v) + 4, "text-anchor":"end", class:"ax"}, svg); tx.textContent = nf.format(v);
  }
  counts.forEach((c, h) => {
    const x = L + h * bw + 1, w = bw - 2, y = Y(c);
    if (c > 0) el("path", {d:topRound(x, y, w, T + ih - y, 4), fill:"var(--series-1)"}, svg);
    if (h % 3 === 0) { const tx = el("text", {x:L + h * bw + bw / 2, y:H - 6, "text-anchor":"middle", class:"ax"}, svg); tx.textContent = String(h).padStart(2, "0"); }
    const hit = el("rect", {x:L + h * bw, y:T, width:bw, height:ih, fill:"transparent"}, svg);
    hit.addEventListener("pointermove", e => showTip(e, `${String(h).padStart(2, "0")}:00–${String(h).padStart(2, "0")}:59`, [[t("tCases"), nf.format(c)], [t("tShare"), short ? nf1.format(c / short * 100) + (lang === "de" ? " %" : "%") : "–"]]));
    hit.addEventListener("pointerleave", hideTip);
  });
  document.getElementById("hr-sub").textContent = t("hrSub", all ? Math.round(short / all * 100) : 0);
  setTable("hr", [t("hHour"), t("tCases")], counts.map((c, h) => [String(h).padStart(2, "0") + ":00", nf.format(c)]));
}

/* ================= bike types ================= */
function renderTypes(m) {
  const c = new Array(meta.types.length).fill(0); let n = 0;
  for (let i = 0; i < N; i++) if (m[i]) { c[cases.t[i]]++; n++; }
  const items = c.map((v, i) => ({i, v})).filter(o => o.v > 0).sort((a, b) => b.v - a.v);
  const pc = v => nf1.format(v / n * 100) + (lang === "de" ? " %" : "%");
  hbars(document.getElementById("ty"), items.map(o => ({
    label: typeLabel(o.i), value: o.v, text: nf.format(o.v), active: state.type === o.i,
    tip: [[t("tCases"), nf.format(o.v)], [t("tShare"), pc(o.v)], ...(lang === "en" ? [[t("tRecorded"), meta.types[o.i]]] : [])]
  })), items.length ? items[0].v : 1);
  setTable("ty", [t("hType"), t("hRec"), t("tCases")], items.map(o => [typeLabel(o.i), meta.types[o.i], nf.format(o.v)]));
}

/* ================= districts ================= */
function renderDistricts() {
  const cnt = {}, km = {}, pp = {};
  meta.bezirke.forEach(b => { cnt[b.id] = 0; km[b.id] = 0; pp[b.id] = 0; });
  areas.forEach((a, i) => { cnt[a.bez] += mapCounts[i]; km[a.bez] += a.km2; pp[a.bez] += a.pop; });
  const val = b => state.metric === "count" ? cnt[b] : state.metric === "density" ? cnt[b] / km[b] : cnt[b] / pp[b] * 1000;
  const items = meta.bezirke.map(b => ({id:b.id, name:b.name, n:cnt[b.id], d:cnt[b.id] / km[b.id], r:cnt[b.id] / pp[b.id] * 1000, v:val(b.id)})).sort((a, b) => b.v - a.v);
  const selBez = state.sel >= 0 ? areas[state.sel].bez : null;
  document.getElementById("di-sub").textContent = t(SUBKEY[state.metric]);
  hbars(document.getElementById("di"), items.map(o => ({
    label: o.name, value: o.v, text: fmtMetric(o.v), active: o.id === selBez,
    tip: [[t("tCases"), nf.format(o.n)], [t("tPerKm2"), nf1.format(o.d)], [t("tResidents"), nf.format(pp[o.id])], [t("tPerK"), nf1.format(o.r)]]
  })), items[0].v);
  setTable("di", [t("hDistrict"), t("tCases"), t("tPerKm2"), t("hPerK")], items.map(o => [o.name, nf.format(o.n), nf1.format(o.d), nf1.format(o.r)]));
}

/* ================= controls ================= */
function btn(label, onclick, extra = {}) { const b = document.createElement("button"); b.textContent = label; b.addEventListener("click", onclick); Object.assign(b.dataset, extra); return b; }
function buildLabels() { // (re)creates every translated control; safe to call on language change
  const sm = document.getElementById("seg-metric");
  sm.replaceChildren(...[["count", "mCount"], ["density", "mDensity"], ["rate", "mRate"]].map(([id, k]) => btn(t(k), () => { state.metric = id; renderAll(); }, {id})));
  const sd = document.getElementById("sel-delikt"); sd.replaceChildren(new Option(t("all"), -1));
  meta.delikte.forEach((d, i) => sd.append(new Option(deliktLabel(i), i))); sd.value = state.delikt;
  const st = document.getElementById("sel-type"); st.replaceChildren(new Option(t("all"), -1));
  meta.types.forEach((_, i) => st.append(new Option(typeLabel(i), i))); st.value = state.type;
}
function applyStatic() {
  document.documentElement.lang = lang; document.title = t("docTitle");
  document.querySelectorAll("[data-i18n]").forEach(e => { e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll("[data-i18n-aria]").forEach(e => e.setAttribute("aria-label", t(e.dataset.i18nAria)));
  document.querySelectorAll(".tbtn").forEach(b => { b.textContent = b.getAttribute("aria-pressed") === "true" ? t("chart") : t("tbl"); });
  document.getElementById("chip").setAttribute("aria-label", t("clearSel"));
  const ul = document.getElementById("notes"); ul.replaceChildren();
  I18N[lang].notes.forEach(x => { const li = document.createElement("li"); li.textContent = x; ul.append(li); });
}
/* ---- period picker: chip + popover (presets, month grid, From/To) + previous/next stepper ---- */
const $ = id => document.getElementById(id);
const rEq = (x, y) => x[0] === y[0] && x[1] === y[1];
const clampDay = d => Math.max(meta.minDay, Math.min(meta.maxDay, d));
const Y0 = new Date(D0).getUTCFullYear(), M0 = new Date(D0).getUTCMonth();
const monthIdx = (y, mo) => (y - Y0) * 12 + (mo - M0);
function describeRange(r) { // chip text: a name when the range is a month / year / preset, plus dates when useful
  const dates = fmtDay(r[0]) + " – " + fmtDay(r[1]), m = monthOfRange(r);
  if (m >= 0) return {name:monLongF.format(dayMs(meta.monthStarts[m])), dates:""};
  const p = presets().find(x => rEq(x.r, r));
  return p ? {name:p.label, dates:p.dates ? dates : ""} : {name:"", dates};
}
function shifted(dir) { // the same-sized period before (-1) / after (+1) the current one, or null if outside the data
  const r = state.range, yi = meta.years.findIndex(([y, a, b]) => a === r[0] && b === r[1]);
  if (meta.years.length > 1 && yi >= 0) { const y = meta.years[yi + dir]; return y ? [y[1], y[2]] : null; }
  let m1 = -1, m2 = -1;
  for (let m = 0; m < NM; m++) { const mr = monthRange(m); if (mr[0] === r[0]) m1 = m; if (mr[1] === r[1]) m2 = m; }
  if (m1 >= 0 && m2 >= m1) { const k = m2 - m1 + 1, a = m1 + dir * k, b = m2 + dir * k; return a < 0 || b >= NM ? null : [monthRange(a)[0], monthRange(b)[1]]; }
  const n = r[1] - r[0] + 1, a = r[0] + dir * n, b = r[1] + dir * n;
  return a < meta.minDay || b > meta.maxDay ? null : [a, b];
}
function updatePeriodChip() {
  const d = describeRange(state.range);
  $("pn").textContent = d.name; $("pn").hidden = !d.name; $("pd").textContent = d.dates; $("pd").hidden = !d.dates;
  $("pchip").setAttribute("aria-label", (t("period") + ": " + d.name + " " + d.dates).replace(/\s+/g, " ").trim());
  $("p-prev").disabled = !shifted(-1); $("p-next").disabled = !shifted(1);
}
let popOpen = false, draft = null; // draft = {a, b, anchor (month index while picking a range), hover}
function buildPop() {
  const pr = $("pop-presets"); pr.replaceChildren();
  presets().forEach(p => {
    if (p.sep) pr.append(document.createElement("hr"));
    const b = document.createElement("button"); b.type = "button";
    const ck = document.createElement("span"); ck.className = "ck"; b.append(ck, document.createTextNode(p.label)); b._p = p;
    b.addEventListener("click", () => { closePop(false); setRange(...p.r); $("pchip").focus(); });
    pr.append(b);
  });
  const g = $("pop-grid"); g.replaceChildren();
  const lastY = new Date(dayMs(meta.maxDay)).getUTCFullYear();
  for (let y = Y0; y <= lastY; y++) {
    const row = document.createElement("div"); row.className = "yr";
    const h = document.createElement("b"); h.textContent = y; row.append(h);
    const grid = document.createElement("div"); grid.className = "mgrid";
    for (let mo = 0; mo < 12; mo++) {
      const m = monthIdx(y, mo), b = document.createElement("button"); b.type = "button";
      b.textContent = monShortF.format(Date.UTC(y, mo, 1)); b.dataset.m = m; b.setAttribute("aria-label", monLongF.format(Date.UTC(y, mo, 1)));
      if (m < 0 || m >= NM) b.disabled = true;
      else {
        b.addEventListener("click", () => pickMonth(m));
        b.addEventListener("pointerenter", () => { if (draft && draft.anchor !== null) { draft.hover = m; paintPop(); } });
      }
      grid.append(b);
    }
    row.append(grid); g.append(row);
  }
}
function pickMonth(m) {
  if (draft.anchor === null) { [draft.a, draft.b] = monthRange(m); draft.anchor = m; }
  else { const lo = Math.min(draft.anchor, m), hi = Math.max(draft.anchor, m); draft.a = monthRange(lo)[0]; draft.b = monthRange(hi)[1]; draft.anchor = null; }
  draft.hover = null; paintPop();
}
function paintPop() {
  const act = presets().find(p => rEq(p.r, state.range));
  $("pop-presets").querySelectorAll("button").forEach(b => { const on = !!act && b._p.id === act.id; b.firstChild.textContent = on ? "✓" : ""; b.classList.toggle("act", on); });
  let lo = draft.a, hi = draft.b;
  if (draft.anchor !== null) { const h = draft.hover ?? draft.anchor; lo = monthRange(Math.min(draft.anchor, h))[0]; hi = monthRange(Math.max(draft.anchor, h))[1]; }
  $("pop-grid").querySelectorAll(".mgrid button:not(:disabled)").forEach(b => {
    const m = +b.dataset.m, r = monthRange(m), inside = r[0] >= lo && r[1] <= hi;
    b.classList.toggle("in", inside); b.classList.toggle("part", !inside && r[0] <= hi && r[1] >= lo); b.classList.toggle("anchor", draft.anchor === m);
  });
  $("pop-hint").textContent = draft.anchor === null ? t("pHint1") : t("pHint2");
  $("d-from").value = isoDay(draft.a); $("d-to").value = isoDay(draft.b);
}
function openPop() {
  draft = {a:state.range[0], b:state.range[1], anchor:null, hover:null};
  popOpen = true; $("pop").hidden = false; $("pchip").setAttribute("aria-expanded", "true");
  buildPop(); paintPop();
  ($("pop-presets").querySelector("button.act") || $("pop-presets").querySelector("button")).focus();
}
function closePop(refocus = true) {
  if (!popOpen) return;
  popOpen = false; draft = null; $("pop").hidden = true; $("pchip").setAttribute("aria-expanded", "false");
  if (refocus) $("pchip").focus();
}
function initPeriod() {
  for (const i of [$("d-from"), $("d-to")]) { i.min = isoDay(meta.minDay); i.max = isoDay(meta.maxDay); }
  $("pchip").addEventListener("click", () => (popOpen ? closePop() : openPop()));
  for (const [id, dir] of [["p-prev", -1], ["p-next", 1]]) $(id).addEventListener("click", () => { const r = shifted(dir); if (r) setRange(...r); });
  $("d-from").addEventListener("change", () => { const v = dayFromIso($("d-from").value); if (Number.isNaN(v) || !draft) return; draft.anchor = null; draft.a = clampDay(v); draft.b = Math.max(draft.a, draft.b); paintPop(); });
  $("d-to").addEventListener("change", () => { const v = dayFromIso($("d-to").value); if (Number.isNaN(v) || !draft) return; draft.anchor = null; draft.b = clampDay(v); draft.a = Math.min(draft.a, draft.b); paintPop(); });
  $("pop-apply").addEventListener("click", () => { const {a, b} = draft; closePop(false); setRange(a, b); $("pchip").focus(); });
  $("pop-cancel").addEventListener("click", () => closePop());
  document.addEventListener("keydown", e => { if (e.key === "Escape" && popOpen) closePop(); });
  document.addEventListener("pointerdown", e => { if (popOpen && !$("pwrap").contains(e.target)) closePop(false); });
}
function initControls() {
  initPeriod();
  document.getElementById("sel-delikt").addEventListener("change", e => { state.delikt = +e.target.value; renderAll(); });
  document.getElementById("sel-type").addEventListener("change", e => { state.type = +e.target.value; renderAll(); });
  document.getElementById("chip").addEventListener("click", () => { state.sel = -1; renderAll(); });
  document.querySelectorAll("#seg-lang button").forEach(b => b.addEventListener("click", () => {
    lang = b.dataset.lang; try { localStorage.setItem("sbLang", lang); } catch (e) {}
    setLocale(); applyStatic(); buildLabels(); renderAll();
  }));
}
function syncControls() {
  updatePeriodChip();
  document.querySelectorAll("#seg-metric button").forEach(b => b.setAttribute("aria-pressed", b.dataset.id === state.metric));
  document.querySelectorAll("#seg-lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  document.getElementById("sel-delikt").value = state.delikt; document.getElementById("sel-type").value = state.type;
  const chip = document.getElementById("chip");
  if (state.sel >= 0) { chip.hidden = false; chip.textContent = `${areas[state.sel].name} (${bezName[areas[state.sel].bez]}) ✕`; } else chip.hidden = true;
}

function renderAll() {
  hideTip(); syncControls();
  const mMap = mask({sel:false}), mSel = mask();
  renderMap(mMap); renderTop(); renderDistricts();
  renderKpis(mSel); renderHour(mSel); renderTypes(mSel); renderTimeline();
  document.getElementById("map-h").textContent = state.sel >= 0 ? t("mapTitleSel", areas[state.sel].name) : t("mapTitle");
  document.getElementById("sub").textContent = t("sub", fmtDay(meta.minDay), fmtDay(meta.maxDay), nf.format(meta.n), dateF.format(Date.parse(meta.updated + "T00:00:00Z")));
}

/* ================= boot ================= */
applyStatic(); buildLabels(); initControls(); renderAll();
let rt; new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(() => { renderTimeline(); renderHour(mask()); renderTop(); }, 80); }).observe(document.body);
</script>
